# Render Blueprint: Automatic 1-Click Deployment of App + Database
services:
  - type: web
    name: canteen-ordering-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: canteen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: canteen-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: canteen-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: canteen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: canteen-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

databases:
  - name: canteen-db
    databaseName: canteen_db
    user: canteen_user
    plan: free
    region: oregon
