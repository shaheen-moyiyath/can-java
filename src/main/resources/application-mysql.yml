# MySQL Production Profile
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: java -jar target/canteen-ordering-system-1.0.0.jar --spring.profiles.active=mysql

spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:canteen_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: never # Set to 'always' if you want automatic initial schema/data seeding
